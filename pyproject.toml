[project]
name = "intelligent-stock-selection-system"
version = "0.1.0"
description = "A minimal stock cycle selection, backtesting, and visualization framework."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
]

[project.optional-dependencies]
viz = ["plotly>=5.0"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
